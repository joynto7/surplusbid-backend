services:
  - type: web
    name: surplusbid-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surplusbid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: surplusbid-redis
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DEPOSIT_PERCENT
        value: "10"
      - key: PAYMENT_DEADLINE_HOURS
        value: "48"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: redis
    name: surplusbid-redis
    plan: free
    ipAllowList: []

databases:
  - name: surplusbid-db
    plan: free
    ipAllowList: []
