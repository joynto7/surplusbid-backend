services:
  - type: web
    name: surplusbid-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: surplusbid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: surplusbid-redis
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: redis
    name: surplusbid-redis
    plan: free
    ipAllowList: []

databases:
  - name: surplusbid-db
    plan: free
    ipAllowList: []
